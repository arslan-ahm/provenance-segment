# Small end-to-end check on the validation split (development data, never reported as a result).
name: smoke_dev
models_file: ../models.yaml
data: {raw_dir: data/raw, processed_dir: data/processed, split: validation, pool_split: train}
sample: {n_answerable: 4, n_unanswerable: 1, seed: 1, max_per_doc: 1}
noise: {levels: [0, 10], mode: random, seed: 7}
context_budget: 2048
base_model: base
verifier: {kind: nli, model: cross-encoder/nli-deberta-v3-small, window_sentences: [1, 3]}
judge: {kind: llm, model_ref: judge}
systems:
  - {name: direct, kind: direct}
  - {name: rag_bm25, kind: rag, retriever: bm25}
  - {name: segment, kind: segment}
  - {name: provseg, kind: provseg}
runs_dir: runs
cache_dir: cache/llm
question_workers: 2
note_workers: 4
